<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>User block internal editor browser smoke</title>
</head>
<body>
  <div id="result">RUNNING</div>
  <iframe id="app" src="../index.html" style="width:1200px;height:800px"></iframe>
  <script>
    const frame = document.getElementById('app');

    frame.addEventListener('load', () => {
      const script = frame.contentDocument.createElement('script');
      script.textContent = `
        (() => {
          const finish = text => { parent.document.getElementById('result').textContent = text; };

          // The editor talks to the user through window dialogs. Record them so a
          // silent failure (a save that never happened) cannot pass as a success.
          const alerts = [];
          window.alert = message => alerts.push(String(message));
          window.confirm = () => true;
          let blockName = 'block';
          window.prompt = () => blockName;

          const connect = (fromId, toId, inputIndex) => {
            graph.connections = graph.connections.filter(c => !(c.to === toId && c.inputIndex === inputIndex));
            graph.connections.push({ from: fromId, to: toId, inputIndex });
          };
          const numberNode = value => {
            const node = addBlock('number');
            node.params.value = value;
            return node;
          };
          const scalarVariable = (name, value) => {
            const node = addBlock('variable');
            node.params.name = name;
            node.params.mode = 'scalar';
            node.params.value = value;
            return node;
          };
          const groupInto = (name, nodes) => {
            blockName = name;
            startGroupSelection();
            for (const node of nodes) toggleGroupNode(node.id);
            createUserBlockFromSelection();
            return [...USER_BLOCKS.values()].find(definition => definition.name === name);
          };
          const internalNodeOfType = type => [...graph.nodes.values()].find(node => node.type === type);

          const reset = () => {
            alerts.length = 0;
            resetWorkspace();
            USER_BLOCKS.clear();
            renderMyBlocksPalette();
          };

          try {
            // ---- editing a nested block must reach the blocks that use it ----
            // The compiled plan of the outer block captured the inner definition,
            // and saving the inner one replaces only that object.
            reset();
            const x = scalarVariable('x', 5);
            const two = numberNode(2);
            const innerMultiply = addBlock('multiply');
            connect(x.id, innerMultiply.id, 0);
            connect(two.id, innerMultiply.id, 1);
            const inner = groupInto('inner', [two, innerMultiply]);

            const innerInstance = graph.nodes.get([...graph.nodes.keys()].find(id => graph.nodes.get(id).type === 'custom:' + inner.id));
            const one = numberNode(1);
            const outerAdd = addBlock('add');
            connect(innerInstance.id, outerAdd.id, 0);
            connect(one.id, outerAdd.id, 1);
            const outer = groupInto('outer', [innerInstance, one, outerAdd]);
            const outerInstance = graph.nodes.get([...graph.nodes.keys()].find(id => graph.nodes.get(id).type === 'custom:' + outer.id));

            const before = evaluateNode(outerInstance.id);
            if (before !== 11) throw new Error('nested user block forward is wrong before the edit: ' + before);

            openUserBlockEditor(USER_BLOCKS.get(inner.id));
            internalNodeOfType('number').params.value = 100;
            saveUserBlockEditor();
            if (isUserBlockWorkspaceEditing()) throw new Error('editing the nested block did not save: ' + alerts.join(' | '));

            const after = evaluateNode(outerInstance.id);
            if (after !== 501) {
              throw new Error('the parent block kept running the old nested definition: ' + after);
            }

            // ---- a block must not be able to contain itself ----
            reset();
            const y = scalarVariable('y', 5);
            const three = numberNode(3);
            const multiply = addBlock('multiply');
            connect(y.id, multiply.id, 0);
            connect(three.id, multiply.id, 1);
            const self = groupInto('self', [three, multiply]);
            const selfInstance = graph.nodes.get([...graph.nodes.keys()].find(id => graph.nodes.get(id).type === 'custom:' + self.id));

            openUserBlockEditor(USER_BLOCKS.get(self.id));
            const paletteButton = document.querySelector('[data-custom-block="' + self.id + '"]');
            if (!paletteButton) throw new Error('the edited block is missing from the palette');
            const nodeCount = graph.nodes.size;
            paletteButton.click();
            if (graph.nodes.size !== nodeCount) throw new Error('the block being edited was added inside itself');

            // The same cycle built without the palette must be refused on save,
            // because a saved cycle only shows up as a stack overflow at 계산 time.
            const smuggled = addBlock('custom:' + self.id);
            connect(-1, smuggled.id, 0);
            connect(smuggled.id, internalNodeOfType('multiply').id, 0);
            saveUserBlockEditor();
            if (!isUserBlockWorkspaceEditing()) throw new Error('a self-referencing definition was saved');
            cancelUserBlockEditor();
            if (evaluateNode(selfInstance.id) !== 15) throw new Error('cancelling the recursive edit did not restore the block');

            // ---- 변수 stays outside, exactly as 묶기 leaves it ----
            reset();
            const z = scalarVariable('z', 5);
            const four = numberNode(4);
            const product = addBlock('multiply');
            connect(z.id, product.id, 0);
            connect(four.id, product.id, 1);
            const pure = groupInto('pure', [four, product]);

            openUserBlockEditor(USER_BLOCKS.get(pure.id));
            const beforeVariable = graph.nodes.size;
            document.querySelector('[data-block="variable"]').click();
            if (graph.nodes.size !== beforeVariable) throw new Error('a 변수 block was added inside a definition');
            const beforeAdd = graph.nodes.size;
            document.querySelector('[data-block="add"]').click();
            if (graph.nodes.size !== beforeAdd + 1) throw new Error('an ordinary block can no longer be added inside a definition');
            cancelUserBlockEditor();

            // ---- 추가 묶기 inside the editor keeps a usable output ----
            reset();
            const w = scalarVariable('w', 5);
            const five = numberNode(2);
            const scale = addBlock('multiply');
            connect(w.id, scale.id, 0);
            connect(five.id, scale.id, 1);
            const regroup = groupInto('regroup', [five, scale]);
            const regroupInstance = graph.nodes.get([...graph.nodes.keys()].find(id => graph.nodes.get(id).type === 'custom:' + regroup.id));

            openUserBlockEditor(USER_BLOCKS.get(regroup.id));
            groupInto('nested', [internalNodeOfType('number'), internalNodeOfType('multiply')]);
            saveUserBlockEditor();
            if (isUserBlockWorkspaceEditing()) {
              throw new Error('grouping inside the editor left the definition unsaveable: ' + alerts.join(' | '));
            }
            const regrouped = evaluateNode(regroupInstance.id);
            if (regrouped !== 10) throw new Error('regrouped definition computes the wrong value: ' + regrouped);

            // ---- copy internals without modifying the original or consumers ----
            reset();
            const copyInput = scalarVariable('copyInput', 5);
            const copyFactor = numberNode(2);
            const copyProduct = addBlock('multiply');
            connect(copyInput.id, copyProduct.id, 0);
            connect(copyFactor.id, copyProduct.id, 1);
            const copyDefinition = groupInto('copy source', [copyFactor, copyProduct]);
            const copyInstance = graph.nodes.get(selectedNodeId);
            const consumer = addBlock('display');
            connect(copyInstance.id, consumer.id, 0);
            const beforeDefinition = JSON.stringify(USER_BLOCKS.get(copyDefinition.id));
            const beforeWires = JSON.stringify(graph.connections);
            selectNode(copyInstance.id);
            document.querySelector('.user-block-copy-button').click();
            const copiedOutput = selectedNodeId;
            if (copiedOutput === copyInstance.id || evaluateNode(copiedOutput) !== 10) throw new Error('copy button did not create a working copy');
            if (JSON.stringify(USER_BLOCKS.get(copyDefinition.id)) !== beforeDefinition) throw new Error('copy changed the definition');
            if (!graph.nodes.has(copyInstance.id) || evaluateNode(consumer.id) !== 10) throw new Error('copy changed the original consumer');
            for (const wire of JSON.parse(beforeWires)) {
              if (!graph.connections.some(c => c.from === wire.from && c.to === wire.to && c.inputIndex === wire.inputIndex)) throw new Error('copy removed an existing wire');
            }
            const copiedFactorWire = graph.connections.find(c => c.to === copiedOutput && c.inputIndex === 1);
            graph.nodes.get(copiedFactorWire.from).params.value = 7;
            if (evaluateNode(copiedOutput) !== 35 || evaluateNode(copyInstance.id) !== 10) throw new Error('copy params alias the source');
            copyInput.params.value = 3;
            if (evaluateNode(copiedOutput) !== 21 || evaluateNode(copyInstance.id) !== 6) throw new Error('copy lost the live external input');
            const copiedSnapshot = buildProjectSnapshot();
            rebuildWorkspaceFromSnapshot(copiedSnapshot);
            if (evaluateNode(copiedOutput) !== 21 || evaluateNode(consumer.id) !== 6) throw new Error('copy does not survive save/load');

            selectNode(copyInstance.id);
            openUserBlockEditor(USER_BLOCKS.get(copyDefinition.id));
            internalNodeOfType('number').params.value = 9;
            document.getElementById('userBlockEditorCopy').click();
            if (isUserBlockWorkspaceEditing() || evaluateNode(selectedNodeId) !== 27 || evaluateNode(copyInstance.id) !== 27) throw new Error('save and copy did not use the edited definition');
            disconnectInput(copyInstance.id, 0);
            const unconnectedCopy = copyUserBlockContents(copyInstance.id);
            if (!unconnectedCopy || unconnectedCopy.missingInputs !== 1) throw new Error('missing external input was not left available to connect');

            // Nested copies retain a usable custom instance at the next level.
            // Use a fresh nesting of copy source.
            const nestedSource = addBlock('custom:' + copyDefinition.id);
            connect(copyInput.id, nestedSource.id, 0);
            const nestedCopyDef = groupInto('nested copy', [nestedSource]);
            const nestedCopy = copyUserBlockContents(selectedNodeId);
            if (!nestedCopy || graph.nodes.get(nestedCopy.outputId).type !== 'custom:' + copyDefinition.id || evaluateNode(nestedCopy.outputId) !== 27) throw new Error('nested block copy is wrong');

            // ---- insertion follows the viewport, including inside the editor ----
            const assertVisible = node => {
              const bounds = workspace.getBoundingClientRect();
              const rect = nodesLayer.querySelector('[data-node-id="' + node.id + '"]').getBoundingClientRect();
              if (rect.left < bounds.left - 1 || rect.top < bounds.top - 1 || rect.left >= bounds.right || rect.top >= bounds.bottom) throw new Error('new block header is outside the viewport');
              if (rect.width < bounds.width - 32 && rect.right > bounds.right + 1) throw new Error('new block exceeds viewport width');
              if (rect.height < bounds.height - 32 && rect.bottom > bounds.bottom + 1) throw new Error('new block exceeds viewport height');
            };
            for (const zoom of [0.35, 1, 2.5]) {
              restoreWorkspaceViewSnapshot({ x: -4000, y: 3000, zoom });
              for (let i = 0; i < 8; i++) assertVisible(addBlock('add'));
            }
            const explicit = addBlock('number', { x: 12345, y: -9876 });
            if (explicit.x !== 12345 || explicit.y !== -9876) throw new Error('explicit placement changed');
            openUserBlockEditor(USER_BLOCKS.get(nestedCopyDef.id));
            restoreWorkspaceViewSnapshot({ x: 2300, y: -1700, zoom: 0.6 });
            assertVisible(addBlock('number'));
            cancelUserBlockEditor();

            finish('PASS');
          } catch (error) {
            console.error(error);
            finish('FAIL: ' + (error && error.stack ? error.stack : error));
          }
        })();
      `;
      frame.contentDocument.body.appendChild(script);
    });
  </script>
</body>
</html>
