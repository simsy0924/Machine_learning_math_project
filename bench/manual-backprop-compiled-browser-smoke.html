<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Compiled manual backprop smoke</title>
</head>
<body>
  <div id="result">RUNNING</div>
  <iframe id="app" src="../index.html" style="width:1200px;height:800px"></iframe>
  <script>
    const frame = document.getElementById('app');

    frame.addEventListener('load', () => {
      const script = frame.contentDocument.createElement('script');
      script.textContent = `
        (() => {
          const finish = text => { parent.document.getElementById('result').textContent = text; };
          try {
            if (typeof manualBackpropExecutionPlanFor !== 'function') {
              throw new Error('compiled manual backprop runtime is not loaded');
            }
            if (typeof userBlockForwardTraceFor !== 'function') {
              throw new Error('user-block forward trace runtime is not loaded');
            }

            const noY = {
              nodes: [
                { id: 1, type: 'multiply', params: {} },
                { id: 2, type: 'multiply', params: {} }
              ],
              connections: [
                { from: MANUAL_BACKPROP_UPSTREAM_ID, to: 1, inputIndex: 0 },
                { from: manualBackpropInputSourceId(1), to: 1, inputIndex: 1 },
                { from: MANUAL_BACKPROP_UPSTREAM_ID, to: 2, inputIndex: 0 },
                { from: manualBackpropInputSourceId(0), to: 2, inputIndex: 1 }
              ],
              gradientOutputNodeIds: [1, 2]
            };

            const plan1 = manualBackpropExecutionPlanFor(noY, 2);
            const plan2 = manualBackpropExecutionPlanFor(noY, 2);
            if (plan1 !== plan2) throw new Error('manual backward plan was not cached');
            if (plan1.usesForwardOutput) throw new Error('no-y definition incorrectly requires forward output');

            const rawGradients = executeCompiledManualBackpropPlan(plan1, [3, 4], undefined, 2);
            if (rawGradients[0] !== 8 || rawGradients[1] !== 6) {
              throw new Error('compiled gradients mismatch: ' + JSON.stringify(rawGradients));
            }

            resetWorkspace();
            const scalarVariable = (name, value = 0) => {
              const node = addBlock('variable');
              node.params.name = name;
              node.params.mode = 'scalar';
              node.params.value = value;
              return node;
            };
            const g = scalarVariable('g', 2);
            const ga = scalarVariable('ga', 0);
            const gb = scalarVariable('gb', 0);

            const previousMultiplyBackward = MANUAL_BACKPROP_BUILTINS.get('multiply');
            MANUAL_BACKPROP_BUILTINS.set('multiply', noY);

            let forwardCalls = 0;
            const fakeBase = {
              title: 'fake multiply',
              compute() {
                forwardCalls++;
                return 12;
              }
            };
            const backwardNode = {
              params: {
                manualBackpropUpstream: 'g',
                manualBackpropGradient0: 'ga',
                manualBackpropGradient1: 'gb'
              }
            };

            for (let i = 0; i < 100; i++) {
              executeManualBackpropNode('multiply', fakeBase, backwardNode, [3, 4]);
            }

            if (forwardCalls !== 0) {
              throw new Error('owner forward was recomputed even though y is unused: ' + forwardCalls);
            }
            if (readRuntimeVariable(ga) !== 8 || readRuntimeVariable(gb) !== 6) {
              throw new Error('named gradient writes mismatch');
            }

            // The gradient destinations, the upstream variable and the required
            // branches are cached per node instance. Editing them in the
            // inspector must take effect on the very next execution.
            const gc2 = scalarVariable('gc2', 0);
            backwardNode.params.manualBackpropGradient0 = '';
            backwardNode.params.manualBackpropGradient1 = 'gc2';
            executeManualBackpropNode('multiply', fakeBase, backwardNode, [3, 4]);
            if (readRuntimeVariable(gc2) !== 6) {
              throw new Error('edited gradient destination was not picked up: ' + readRuntimeVariable(gc2));
            }
            if (readRuntimeVariable(gb) !== 6) {
              throw new Error('a destination cleared to blank must stop writing its old variable');
            }

            const g2 = scalarVariable('g2', 10);
            backwardNode.params.manualBackpropUpstream = 'g2';
            executeManualBackpropNode('multiply', fakeBase, backwardNode, [3, 4]);
            if (readRuntimeVariable(gc2) !== 30) {
              throw new Error('edited upstream variable was not picked up: ' + readRuntimeVariable(gc2));
            }

            backwardNode.params.manualBackpropUpstream = 'g';
            backwardNode.params.manualBackpropGradient0 = 'ga';
            backwardNode.params.manualBackpropGradient1 = 'gb';

            const usesY = {
              nodes: [{ id: 1, type: 'multiply', params: {} }],
              connections: [
                { from: MANUAL_BACKPROP_OUTPUT_ID, to: 1, inputIndex: 0 },
                { from: MANUAL_BACKPROP_UPSTREAM_ID, to: 1, inputIndex: 1 }
              ],
              gradientOutputNodeIds: [1, 1]
            };
            MANUAL_BACKPROP_BUILTINS.set('multiply', usesY);
            forwardCalls = 0;
            executeManualBackpropNode('multiply', fakeBase, backwardNode, [3, 4]);
            if (forwardCalls !== 1) {
              throw new Error('y-dependent built-in definition must compute forward exactly once: ' + forwardCalls);
            }
            if (readRuntimeVariable(ga) !== 24 || readRuntimeVariable(gb) !== 24) {
              throw new Error('y-dependent compiled gradients mismatch');
            }

            if (previousMultiplyBackward) MANUAL_BACKPROP_BUILTINS.set('multiply', previousMultiplyBackward);
            else MANUAL_BACKPROP_BUILTINS.delete('multiply');

            // Same custom definition called twice in one leaf-generation: the
            // internal a*2 part is identical and must run only once.
            const originalMultiplyCompute = BLOCKS.multiply.compute;
            let multiplyCalls = 0;
            BLOCKS.multiply.compute = (node, inputs) => {
              multiplyCalls++;
              return originalMultiplyCompute(node, inputs);
            };

            const sharedId = 'compiled-shared-subexpr';
            const sharedDefinition = {
              id: sharedId,
              name: 'SharedSubexpr',
              nodes: [
                { id: 1, type: 'multiply', params: {} },
                { id: 2, type: 'number', params: { value: 2 } },
                { id: 3, type: 'add', params: {} }
              ],
              connections: [
                { from: 2, to: 1, inputIndex: 1 },
                { from: 1, to: 3, inputIndex: 0 }
              ],
              externalInputs: [
                { nodeId: 1, inputIndex: 0, label: 'a' },
                { nodeId: 3, inputIndex: 1, label: 'b' }
              ],
              outputNodeId: 3,
              formula: '2a+b'
            };
            USER_BLOCKS.set(sharedId, sharedDefinition);
            beginUserBlockExecutionGeneration();
            const sharedA = evaluateUserDefinition(sharedDefinition, [3, 4]);
            const sharedB = evaluateUserDefinition(sharedDefinition, [3, 5]);
            if (sharedA !== 10 || sharedB !== 11) {
              throw new Error('shared-subexpression forward values mismatch');
            }
            if (multiplyCalls !== 1) {
              throw new Error('identical internal forward subexpression was recomputed: ' + multiplyCalls);
            }

            // Forward y=(a*b)*c. Only dc is requested. Its authored backward is
            // dc=g*(a*b), so a*b must come from the prior forward trace. The da/db
            // branches are intentionally present but have blank destinations and
            // therefore must not execute at all.
            const productId = 'compiled-forward-trace';
            const productDefinition = {
              id: productId,
              name: 'Product3',
              nodes: [
                { id: 1, type: 'multiply', params: {} },
                { id: 2, type: 'multiply', params: {} }
              ],
              connections: [
                { from: 1, to: 2, inputIndex: 0 }
              ],
              externalInputs: [
                { nodeId: 1, inputIndex: 0, label: 'a' },
                { nodeId: 1, inputIndex: 1, label: 'b' },
                { nodeId: 2, inputIndex: 1, label: 'c' }
              ],
              outputNodeId: 2,
              formula: 'abc',
              manualBackprop: {
                nodes: [
                  { id: 1, type: 'multiply', params: {} },
                  { id: 2, type: 'multiply', params: {} },
                  { id: 3, type: 'multiply', params: {} },
                  { id: 4, type: 'multiply', params: {} }
                ],
                connections: [
                  { from: manualBackpropInputSourceId(0), to: 1, inputIndex: 0 },
                  { from: manualBackpropInputSourceId(1), to: 1, inputIndex: 1 },
                  { from: MANUAL_BACKPROP_UPSTREAM_ID, to: 2, inputIndex: 0 },
                  { from: 1, to: 2, inputIndex: 1 },
                  { from: MANUAL_BACKPROP_UPSTREAM_ID, to: 3, inputIndex: 0 },
                  { from: manualBackpropInputSourceId(2), to: 3, inputIndex: 1 },
                  { from: 3, to: 4, inputIndex: 0 },
                  { from: manualBackpropInputSourceId(1), to: 4, inputIndex: 1 }
                ],
                gradientOutputNodeIds: [4, 3, 2]
              }
            };
            USER_BLOCKS.set(productId, productDefinition);

            resetWorkspace();
            const gg = scalarVariable('gg', 5);
            const gc = scalarVariable('gc', 0);
            multiplyCalls = 0;
            beginUserBlockExecutionGeneration();
            const productForward = evaluateUserDefinition(productDefinition, [2, 3, 4]);
            if (productForward !== 24) throw new Error('product forward mismatch');
            if (multiplyCalls !== 2) throw new Error('product forward must use two multiplies');

            const productBackwardNode = {
              params: {
                manualBackpropUpstream: 'gg',
                manualBackpropGradient0: '',
                manualBackpropGradient1: '',
                manualBackpropGradient2: 'gc'
              }
            };
            const productBase = FORWARD_GET_BLOCK_DEF('custom:' + productId);
            executeManualBackpropNode(
              'custom:' + productId,
              productBase,
              productBackwardNode,
              [2, 3, 4]
            );

            if (readRuntimeVariable(gc) !== 30) {
              throw new Error('forward-trace backward gradient mismatch: ' + readRuntimeVariable(gc));
            }
            if (multiplyCalls !== 3) {
              throw new Error('backward did not reuse forward a*b or pruned dead gradients: ' + multiplyCalls);
            }

            const productPlan = manualBackpropExecutionPlanFor(
              productDefinition.manualBackprop,
              3,
              [false, false, true],
              productDefinition
            );
            if (!productPlan.usesForwardTrace) throw new Error('matching forward expression was not recognized');
            if (productPlan.steps.filter(step => step.kind === 'compute').length !== 1) {
              throw new Error('dead/cached backward steps were not removed');
            }

            BLOCKS.multiply.compute = originalMultiplyCompute;
            USER_BLOCKS.delete(sharedId);
            USER_BLOCKS.delete(productId);
            finish('PASS');
          } catch (error) {
            console.error(error);
            finish('FAIL: ' + (error && error.stack ? error.stack : error));
          }
        })();
      `;
      frame.contentDocument.body.appendChild(script);
    });
  </script>
</body>
</html>
