name: Build Quick Draw Cairo WASM

on:
  push:
    branches:
      - main
      - feature/quickdraw-cairo-wasm
    paths:
      - 'app-drawing-preprocess.js'
      - 'bench/quickdraw-cairo-check.mjs'
      - 'wasm/quickdraw-cairo/**'
      - '.github/workflows/build-quickdraw-cairo-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:4.0.10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils ninja-build pkg-config python3-pip
          python3 -m pip install --no-cache-dir 'meson==1.7.0'
          meson --version

      - name: Build minimal single-thread pixman and Cairo
        shell: bash
        run: |
          set -euxo pipefail

          PIXMAN_VERSION=0.46.4
          CAIRO_VERSION=1.18.4
          PREFIX="$GITHUB_WORKSPACE/.wasm-prefix"
          BUILD_ROOT="$RUNNER_TEMP/quickdraw-cairo-build"
          mkdir -p "$PREFIX" "$BUILD_ROOT" vendor
          cd "$BUILD_ROOT"

          cat > emscripten.cross <<'EOF'
          [binaries]
          c = 'emcc'
          cpp = 'em++'
          ar = 'emar'
          ranlib = 'emranlib'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = []
          c_link_args = []
          c_thread_count = 0
          cpp_thread_count = 0

          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'
          EOF

          curl -fL --retry 3 \
            "https://cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.xz" \
            -o "pixman-${PIXMAN_VERSION}.tar.xz"
          curl -fL --retry 3 \
            "https://cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.xz.sha512" \
            -o "pixman-${PIXMAN_VERSION}.tar.xz.sha512"
          sha512sum -c "pixman-${PIXMAN_VERSION}.tar.xz.sha512"

          curl -fL --retry 3 \
            "https://cairographics.org/releases/cairo-${CAIRO_VERSION}.tar.xz" \
            -o "cairo-${CAIRO_VERSION}.tar.xz"
          echo '445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb  cairo-1.18.4.tar.xz' | sha256sum -c -

          tar -xf "pixman-${PIXMAN_VERSION}.tar.xz"
          tar -xf "cairo-${CAIRO_VERSION}.tar.xz"

          # Only the portable pixman library is needed. Tests are disabled so
          # their thread executables do not become part of the cross build.
          meson setup pixman-build "pixman-${PIXMAN_VERSION}" \
            --cross-file emscripten.cross \
            --prefix "$PREFIX" \
            --libdir lib \
            --default-library static \
            --buildtype release \
            -Dtests=disabled
          meson compile -C pixman-build
          meson install -C pixman-build

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          # Browser execution is single-threaded. CAIRO_NO_MUTEX is Cairo's
          # documented opt-in for platforms that intentionally provide no mutex
          # implementation; it prevents cairo-mutex from calling pthread APIs.
          # Font and non-image surface backends are disabled as well.
          meson setup cairo-build "cairo-${CAIRO_VERSION}" \
            --cross-file emscripten.cross \
            --prefix "$PREFIX" \
            --libdir lib \
            --default-library static \
            --buildtype release \
            -Dc_args=-DCAIRO_NO_MUTEX=1 \
            -Dfontconfig=disabled \
            -Dfreetype=disabled \
            -Ddwrite=disabled \
            -Dpng=disabled \
            -Dzlib=disabled \
            -Dquartz=disabled \
            -Dtee=disabled \
            -Dxcb=disabled \
            -Dxlib=disabled \
            -Dxlib-xcb=disabled \
            -Dtests=disabled \
            -Dlzo=disabled \
            -Dgtk2-utils=disabled \
            -Dglib=disabled \
            -Dspectre=disabled \
            -Dsymbol-lookup=disabled \
            -Dgtk_doc=false
          meson compile -C cairo-build
          meson install -C cairo-build

          cd "$GITHUB_WORKSPACE"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          test "$(pkg-config --modversion pixman-1)" = "$PIXMAN_VERSION"
          test "$(pkg-config --modversion cairo)" = "$CAIRO_VERSION"

          # Meson's generic Emscripten `threads` dependency writes -pthread to
          # cairo.pc even when Cairo is compiled with CAIRO_NO_MUTEX. Do not use
          # those metadata-only thread flags for the final browser module.
          # Link the two static libraries directly; a missing pthread symbol now
          # becomes a hard link error instead of silently enabling shared memory.
          emcc \
            wasm/quickdraw-cairo/quickdraw_cairo_module.c \
            -I"$PREFIX/include/cairo" \
            -I"$PREFIX/include/pixman-1" \
            -L"$PREFIX/lib" \
            -lcairo \
            -lpixman-1 \
            -lm \
            -ldl \
            -O3 \
            -flto \
            --no-entry \
            -sWASM=1 \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=QuickDrawCairoModule \
            -sALLOW_MEMORY_GROWTH=1 \
            -sENVIRONMENT=web,node \
            -sFILESYSTEM=0 \
            -sEXPORTED_FUNCTIONS='["_qd_reset","_qd_begin_stroke","_qd_add_point","_qd_render","_qd_raster_ptr","_qd_raster_length","_qd_get_last_status","_qd_get_point_count","_qd_cairo_version"]' \
            -sEXPORTED_RUNTIME_METHODS='["HEAPU8","UTF8ToString"]' \
            -o vendor/quickdraw-cairo.js

          test -s vendor/quickdraw-cairo.js
          test -s vendor/quickdraw-cairo.wasm
          ! grep -q 'PThread' vendor/quickdraw-cairo.js
          ! grep -q 'SharedArrayBuffer' vendor/quickdraw-cairo.js
          ls -lh vendor/quickdraw-cairo.js vendor/quickdraw-cairo.wasm

      - name: Smoke-test generated Cairo runtime
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const path = require('path');
          const createModule = require('./vendor/quickdraw-cairo.js');

          (async () => {
            const module = await createModule({
              locateFile(file) {
                return path.join(process.cwd(), 'vendor', file);
              }
            });

            module._qd_reset();
            if (module._qd_begin_stroke() < 0) throw new Error('begin stroke failed');
            for (let i = 0; i <= 255; i += 5) {
              if (module._qd_add_point(i, i) !== 0) throw new Error('add point failed');
            }
            if (module._qd_render() !== 0) throw new Error('render failed');

            const length = module._qd_raster_length();
            if (length !== 784) throw new Error(`unexpected raster length ${length}`);
            const ptr = module._qd_raster_ptr();
            const pixels = module.HEAPU8.subarray(ptr, ptr + length);
            const nonzero = pixels.reduce((n, value) => n + (value > 0), 0);
            const sum = pixels.reduce((n, value) => n + value, 0);
            if (nonzero < 10 || sum <= 0) throw new Error('Cairo raster is empty');

            const version = module.UTF8ToString(module._qd_cairo_version());
            if (version !== '1.18.4') throw new Error(`unexpected Cairo version ${version}`);
            console.log(`Cairo ${version} · ${nonzero} nonzero pixels · sum ${sum}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check browser integration syntax
        shell: bash
        run: |
          set -euxo pipefail
          node --check app-drawing-preprocess.js
          node --check bench/quickdraw-cairo-check.mjs

      - name: Commit generated runtime
        shell: bash
        if: github.ref_name == 'feature/quickdraw-cairo-wasm'
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/quickdraw-cairo.js vendor/quickdraw-cairo.wasm
          if git diff --cached --quiet; then
            echo 'Generated Cairo runtime is already up to date.'
            exit 0
          fi
          git commit -m 'Build Quick Draw Cairo WASM runtime [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  browser-integration:
    if: github.actor != 'github-actions[bot]'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Playwright package
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0

      - name: Exercise hand drawing through Chromium and Cairo WASM
        shell: bash
        run: |
          set -euxo pipefail
          node bench/quickdraw-cairo-check.mjs
