name: Manual backprop smoke check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'bench/**'
      - 'bench/manual-backprop-browser-smoke.html'
      - 'bench/manual-backprop-compiled-browser-smoke.html'
      - 'bench/user-block-editor-browser-smoke.html'
      - '.github/workflows/manual-backprop-smoke.yml'
  push:
    branches:
      - manual-backprop
    paths:
      - 'index.html'
      - 'js/**'
      - 'bench/**'
      - 'bench/manual-backprop-browser-smoke.html'
      - 'bench/manual-backprop-compiled-browser-smoke.html'
      - 'bench/user-block-editor-browser-smoke.html'
      - '.github/workflows/manual-backprop-smoke.yml'

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify automatic differentiation is not loaded
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'js/autodiff(-compiled|-spatial-fusion)?\.js' index.html
          # bench/ is included: a check script that still calls a removed
          # autodiff entry point silently stops checking anything.
          ! grep -R -nE 'differentiateGraph\(|computeAllGraphGradients\(|primitiveVJP\(|userBlockVJP\(' js bench index.html

      - name: Verify numeric kernels and Float32 rounding
        run: node bench/numeric-kernel-check.mjs

      - name: Verify manual runtimes are loaded
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'js/manual-backprop.js' index.html
          grep -n 'js/manual-backprop-compiled.js' index.html
          grep -n 'js/user-block-forward.js' index.html
          grep -n 'js/manual-math-extensions.js' index.html

      - name: Run manual backprop in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mmlab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done

          BROWSER="$(command -v google-chrome || true)"
          if [ -z "$BROWSER" ]; then BROWSER="$(command -v google-chrome-stable || true)"; fi
          if [ -z "$BROWSER" ]; then BROWSER="$(command -v chromium || true)"; fi
          if [ -z "$BROWSER" ]; then BROWSER="$(command -v chromium-browser || true)"; fi
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-based browser found on runner.' >&2
            exit 1
          fi

          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8765/bench/manual-backprop-browser-smoke.html \
            > /tmp/manual-backprop-smoke-dom.html

          cat /tmp/manual-backprop-smoke-dom.html
          grep -q '<div id="result">PASS</div>' /tmp/manual-backprop-smoke-dom.html

          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8765/bench/manual-backprop-compiled-browser-smoke.html \
            > /tmp/manual-backprop-compiled-smoke-dom.html

          cat /tmp/manual-backprop-compiled-smoke-dom.html
          grep -q '<div id="result">PASS</div>' /tmp/manual-backprop-compiled-smoke-dom.html

          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8765/bench/user-block-editor-browser-smoke.html \
            > /tmp/user-block-editor-smoke-dom.html

          cat /tmp/user-block-editor-smoke-dom.html
          grep -q '<div id="result">PASS</div>' /tmp/user-block-editor-smoke-dom.html

      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/mmlab-tests" --no-package-lock playwright

      - name: Check arena and spatial gradients in the browser
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mmlab-tests/node_modules/playwright"
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          node bench/arena-check.mjs
          node bench/spatial-math-check.mjs
          node bench/spatial-backprop-check.mjs

      - name: Compare training with the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mmlab-tests/node_modules/playwright"
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/mmlab-base" "$BASE_SHA"
          # Use identical fixtures and the optional system-browser path on both.
          cp bench/train-bench.mjs "$RUNNER_TEMP/mmlab-base/bench/train-bench.mjs"
          mkdir -p benchmark-results
          for hidden in 0 64; do
            node "$RUNNER_TEMP/mmlab-base/bench/train-bench.mjs" --steps 10000 --runs 3 --warmup 1 --hidden "$hidden" --json > "benchmark-results/base-$hidden.json"
            node bench/train-bench.mjs --steps 10000 --runs 3 --warmup 1 --hidden "$hidden" --json > "benchmark-results/current-$hidden.json"
            node bench/train-bench.mjs --steps 10000 --runs 3 --warmup 1 --hidden "$hidden" --no-fusion --json > "benchmark-results/no-fusion-$hidden.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const hidden of [0, 64]) {
            const base = JSON.parse(fs.readFileSync(`benchmark-results/base-${hidden}.json`));
            const current = JSON.parse(fs.readFileSync(`benchmark-results/current-${hidden}.json`));
            const noFusion = JSON.parse(fs.readFileSync(`benchmark-results/no-fusion-${hidden}.json`));
            const checksum = base.results[0].checksum;
            if ([...base.results, ...current.results, ...noFusion.results].some(r => r.checksum !== checksum)) throw new Error(`Weight mismatch: hidden=${hidden}`);
            const median = report => report.results.map(r => r.stepsPerSecond).sort((a, b) => a - b)[1];
            console.log(JSON.stringify({ hidden, checksum, baseStepsPerSecond: median(base), currentStepsPerSecond: median(current), noFusionStepsPerSecond: median(noFusion), speedup: median(current) / median(base), noFusionSpeedup: median(noFusion) / median(base) }));
          }
          JS

      - name: Keep benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-benchmarks
          path: benchmark-results/*.json
          if-no-files-found: ignore
